name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  backend:
    name: Backend (lint, typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growthtracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/growthtracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growthtracker_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/growthtracker_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/growthtracker_e2e
      # Throwaway values for a disposable CI database; never used anywhere else.
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789abcdef0123456789
      # NODE_ENV=production is set only on the API process (below). Set here it
      # would make `npm ci` skip devDependencies (ts-node, Playwright).
      API_PROXY_SECRET: ci-only-proxy-secret-0123456789abcdef0123456789ab
      PORT: 5000
      CORS_ORIGIN: http://localhost:3100
      # All browser traffic reaches the API from the Next.js server's IP, so the
      # whole suite shares one per-IP budget; lift it so the run isn't throttled.
      RATE_LIMIT_MAX_REQUESTS: 100000
      API_ORIGIN: http://localhost:5000
      # The coach talks to a local fake of the OpenAI API; no real key in CI.
      OPENAI_API_KEY: sk-fake-ci-0123456789abcdef
      OPENAI_BASE_URL: http://127.0.0.1:5100/v1
      DEMO_LOGIN_ENABLED: 'true'
      NEXT_PUBLIC_DEMO_LOGIN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Start the API with demo data
        working-directory: backend
        run: |
          npm ci --include=dev
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          # Same commands as Render's start: compiled seed, then the API in
          # production mode (it only accepts requests through the app's proxy).
          node dist/scripts/seed.js
          nohup npx ts-node --transpile-only tests/fake-openai-server.ts > fake-openai.log 2>&1 &
          NODE_ENV=production nohup npm start > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5000/health && exit 0; sleep 1; done
          cat api.log; exit 1

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/api.log
            backend/fake-openai.log
          retention-days: 7
