name: Digests

# Sends the morning and evening notifications. The API on Vercel only runs while
# it's handling a request, so it can't keep a timer of its own: this asks it
# every half hour to send whatever's due. Off until the repository variable
# DIGESTS_ENABLED is 'true' (README → Phone app); API_URL is the API's address.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    name: Send what's due
    if: github.repository == 'Nadeeja99/GrowthTracker' && vars.DIGESTS_ENABLED == 'true' && vars.API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Repeating is safe: each digest is claimed once per day.
      - name: Ask the API to send digests
        env:
          API_URL: ${{ vars.API_URL }}
          DIGEST_CRON_SECRET: ${{ secrets.DIGEST_CRON_SECRET }}
        run: >-
          curl --silent --show-error --fail --retry 3 --retry-all-errors --retry-delay 10 --max-time 60
          --request POST --header "Authorization: Bearer $DIGEST_CRON_SECRET"
          "$API_URL/internal/digests/run"
