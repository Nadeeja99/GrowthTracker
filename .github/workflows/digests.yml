name: Digests

# Sends the morning and evening notifications. A free Render instance sleeps, so
# it can't run its own timer: this wakes the API every half hour and asks it to
# send whatever's due. Each wake keeps the API up for about 15 minutes, so this
# uses roughly 370 of the workspace's 750 free hours a month. Off until the
# repository variable DIGESTS_ENABLED is 'true' (README → Phone app).

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    name: Send what's due
    if: github.repository == 'Nadeeja99/GrowthTracker' && vars.DIGESTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Repeating is safe: each digest is claimed once per day. Retries cover
      # the minute or so a cold start takes.
      - name: Ask the API to send digests
        env:
          DIGEST_CRON_SECRET: ${{ secrets.DIGEST_CRON_SECRET }}
        run: >-
          curl --silent --show-error --fail --retry 8 --retry-all-errors --retry-delay 15 --max-time 90
          --request POST --header "Authorization: Bearer $DIGEST_CRON_SECRET"
          https://growthtracker-api.onrender.com/internal/digests/run
