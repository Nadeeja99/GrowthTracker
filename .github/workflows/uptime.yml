name: Uptime

# Checks the live app and fails (GitHub then emails you) if it isn't healthy.
# Both checks run a database query, which also counts as activity for
# Supabase's free-plan pausing. API_URL and APP_URL are repository variables.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Live app is healthy
    if: github.repository == 'Nadeeja99/GrowthTracker' && vars.API_URL != '' && vars.APP_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.API_URL }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: API and database
        run: curl --silent --show-error --fail --retry 3 --retry-all-errors --retry-delay 10 --max-time 60 "$API_URL/health"

      # After the API, so a failure here points at the app or its proxy (for
      # example a mismatched API_PROXY_SECRET) rather than the API itself.
      - name: App, through its proxy to the API
        run: curl --silent --show-error --fail --retry 3 --retry-all-errors --retry-delay 10 --max-time 60 "$APP_URL/api/health"
