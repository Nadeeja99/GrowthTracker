name: Uptime

# Wakes the live app and fails (GitHub then emails you) if it doesn't come up
# healthy. Six-hourly on purpose: a monitor pinging every few minutes would keep
# the free Render API awake all month, using nearly all of the workspace's 750
# free hours, and the demo account would stop being reset (that happens on cold
# starts). These checks also run a database query, which counts as activity for
# Supabase's free-plan pausing.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Live app is healthy
    if: github.repository == 'Nadeeja99/GrowthTracker'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Retries cover the API's cold start, which takes about a minute.
      - name: API and database
        run: curl --silent --show-error --fail --retry 12 --retry-all-errors --retry-delay 15 --max-time 90 https://growthtracker-api.onrender.com/health

      # After the API, so a failure here points at the app or its proxy rather
      # than a cold start.
      - name: App, through its proxy to the API
        run: curl --silent --show-error --fail --retry 12 --retry-all-errors --retry-delay 15 --max-time 90 https://growth-tracker-azure.vercel.app/api/health
