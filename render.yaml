# Render Blueprint: the Express API as a free web service. The Next.js app runs
# on Vercel, and the database is Supabase Postgres (Render's free Postgres
# expires after 30 days).
#
# The browser only talks to the app. Next.js forwards /api/* to the API with a
# shared secret header, so the refresh cookie stays first-party and the API
# rejects anything that doesn't come through the app. See README → Deployment.
#
# Values marked `sync: false` are asked for once, when the Blueprint is created.
#
# Region: Singapore, the closest Render region to South Asia. Keep the Supabase
# project (ap-southeast-1) and the Vercel app's function region (sin1) there
# too: every request makes several API <-> database round trips. A service's
# region can't be changed after it's created; changing it here means creating
# the service again.

services:
  - type: web
    name: growthtracker-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Free instances have no pre-deploy step, so migrations run on start.
    # With SEED_DEMO_ON_START=true the demo account is rebuilt on every cold
    # start, which keeps its dates current and undoes visitors' changes.
    startCommand: >-
      npx prisma migrate deploy &&
      { [ "$SEED_DEMO_ON_START" != "true" ] || node dist/scripts/seed.js || echo "Demo seed failed; starting anyway"; } &&
      node dist/index.js
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ['backend/**']
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Hops in front of the API when requests come through the app on Vercel.
      # With 2, every visitor shared Vercel's outbound IPs. README → Deployment
      # shows how to check it against the rate-limit headers.
      - key: TRUST_PROXY
        value: '3'
      - key: DATABASE_URL
        sync: false # Supabase transaction pooler (port 6543, ?pgbouncer=true)
      - key: DIRECT_URL
        sync: false # Supabase session pooler (port 5432), used by migrations
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Copy this value to the Vercel project's API_PROXY_SECRET.
      - key: API_PROXY_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # the app's URL, e.g. https://growth-tracker-azure.vercel.app
      - key: SEED_DEMO_ON_START
        value: 'true'
      # "Try the demo" on the sign-in page (pairs with NEXT_PUBLIC_DEMO_LOGIN on the app).
      - key: DEMO_LOGIN_ENABLED
        value: 'true'
      # Demo data is laid out in this zone (the audience is in Ireland).
      - key: SEED_TIMEZONE
        value: Europe/Dublin
      # AI coach. Leave the key empty to run without it; the rest of the app is unaffected.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      # Email for "forgot password" (README → Email). Without it, password
      # reset by email is off and everything else works.
      - key: MAIL_PROVIDER
        sync: false # brevo or resend
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false # the verified sender address
      # Error reporting (README → Monitoring). Without it, errors only go to the logs.
      - key: SENTRY_DSN
        sync: false
      # Push notifications (README → Phone app). Without the keys, offline mode
      # still works and Settings says notifications aren't set up.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: DIGEST_CRON_SECRET
        sync: false # same value as the GitHub secret of that name
