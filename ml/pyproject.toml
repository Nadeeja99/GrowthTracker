[project]
name = "growthtracker-ml"
version = "1.0.0"
description = "Estimate calibration for GrowthTracker: synthetic data, training, evaluation and export to the API."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.2",
    "matplotlib>=3.10",
    "scikit-learn>=1.6",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[project.scripts]
growthtracker-ml = "growthtracker_ml.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/growthtracker_ml"]

[tool.uv]
# Only resolve releases at least two weeks old, so a freshly published
# (possibly compromised) version can't slip into the lockfile.
exclude-newer = "2026-11-08T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs a whole notebook (about 30 seconds each)"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Analysis cells read better unwrapped.
"notebooks/*" = ["E501"]
