services:
  postgres:
    image: postgres:15-alpine
    container_name: growthtracker-postgres
    environment:
      POSTGRES_DB: growthtracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - growthtracker-network


volumes:
  postgres_data:

networks:
  growthtracker-network:
    driver: bridge
